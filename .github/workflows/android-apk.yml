name: Android APK build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "cmdline-tools;latest" "platform-tools" "platforms;android-33" "build-tools;33.0.2" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Set up Godot 4.2.2 and Android export templates
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.2.2-stable_linux.x86_64
          sudo install -m 0755 godot-bin/Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.2.stable"
          mkdir templates-unpacked
          unzip -q templates.tpz -d templates-unpacked
          cp templates-unpacked/templates/* "$HOME/.local/share/godot/export_templates/4.2.2.stable/"

      - name: Create temporary Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -validity 10000

      - name: Configure Godot Android export environment
        run: |
          mkdir -p "$HOME/.config/godot" build
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -f "$HOME/.android/debug.keystore"

      - name: Import and export debug APK
        run: |
          godot --headless --editor --path . --quit --verbose
          godot --headless --path . --export-debug "Android" build/NgocRongDen-debug.apk --verbose
          test -s build/NgocRongDen-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NgocRongDen-Android-debug
          path: build/NgocRongDen-debug.apk
          if-no-files-found: error
          retention-days: 14
